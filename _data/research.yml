      - title: "How Organizations Shape Human-AI Collaboration Through Aggregation"
        authors: "Roh, A., & Jia, N."
        year: 2025
        status: "Minor Revision at Strategy Science"
        abstract: >-
          The common competition-centric view of Artificial Intelligence (AI) suggests that AI and humans
          should be assigned to different tasks based on their respective strengths. However, there is an
          increasing interest in humans and AI collaborating on the same tasks, often referred to as the
          “ensemble” approach. Understanding and fostering this collaboration is crucial, not only to maximize
          AI’s impact but also to redefine human roles in the age of technology. We argue that organizations
          play a key role in shaping how this collaboration unfolds and the resulting outcomes. In our
          conceptual framework, we focus on the judgment calls that organizations and decision-makers must
          make when aggregating predictions from both AI and human sources on the same task. Various
          organizational elements can lead to deviations from optimal aggregation, influencing the
          effectiveness of human-AI collaboration. We contend that the success of this collaboration depends
          not only on the capabilities of the technology but also on the organizational structures and
          dynamics that guide its implementation. This study highlights that the sustained competitive
          advantage of AI adoption lies in an organization’s ability to foster effective human-AI
          collaboration.
        presentations:
          - "ODC RIP; AOM 2025; Caliber Consulting Webinar Series"
      - title: "Opening the Black Box of Large Language Models in Text-based Measurement: Staged Pipelines with Verifiable Checkpoints"
        authors: "Miric, M., Roh, A., & Jia, N."
        year: 2023
        github: "https://github.com/HC-Geopolitics-Innovation/Miric-Roh-Jia-OrgSciSIProposal"
        status: "Under Review"
        abstract: >-
          Researchers increasingly use large language models (LLMs) to construct variables from long, noisy
          documents that were previously impractical to study at scale. When an LLM is used end to end,
          however, the final output is the only observable checkpoint. This opacity makes measures hard to
          validate and reproduce, and it conceals heterogeneity within documents, so systematic measurement
          error can bias subsequent analyses. More capable models will not resolve these concerns, because
          they stem from opacity and lack of control over design choices rather than limited capability.
          We propose decomposing LLM-based measurement into a pipeline of discrete stages, each producing
          an inspectable intermediate output. This design allows researchers to validate each stage against
          its own benchmark, locate where errors arise, revise one stage while reusing the others, and trace
          aggregate measures back to their components. We demonstrate the approach by processing 2,352
          congressional hearings and firms’ 10-K filings to summarize hearings, extract policymakers’
          stances, and measure firms’ exposure to the debate over consumer data privacy. Across 1,058
          publicly traded firms, we demonstrate how the most exposed firms as reflected in our index
          experience a shift in their innovation trajectory towards both data anonymization and user-activity
          tracking. We aim to release the modular code and intermediate datasets, enabling researchers to
          adapt the pipeline with coding agents and to replicate it stage by stage.
        presentations:
          - "AOM 2024; AOM 2025"
      - title: "How AI Shapes Non-AI Positions: Evidence from Professional Service Firms"
        authors: "Jia, N., Roh, A., Song, J., & Wei, Y."
        year: 2025
        status: "Working Paper"
        abstract: >-
          Artificial intelligence (AI) technologies have been widely applied to tasks traditionally requiring
          human cognitive skills (“cognitive tasks”), yet their use in tasks requiring human social skills
          (“social tasks”)—particularly those involving relationship building—remains limited. We argue,
          however, that AI’s growing role in cognitive tasks reshapes organizational expectations of workers
          performing social tasks. We examine professional service firms (PSFs), which solve complex client
          problems by coordinating back-end functions focused on knowledge production with front-end functions
          centered on client interaction and relationship management. We argue that when PSFs increase AI use
          in back-end functions, the resulting gains in knowledge quality and speed increase the demands
          placed on front-end workers. Specifically, increased AI use in back-end functions shapes front-end
          positions in three key ways: (1) it requires greater time commitment, (2) it raises the level of
          human capital needed, and (3) it expands the number of front-end positions. To test these arguments,
          we analyze U.S. job postings from PSFs from 2010 through 2022, distinguishing between AI-related and
          non-AI-related positions as well as between back-end and front-end positions. We further leverage
          the 2015 launch of TensorFlow as a plausibly exogenous shock to the availability of AI applications
          in PSFs. Our findings strongly support our theoretical arguments. More broadly, this study suggests
          that through task interdependence and organizational design, increased AI use can reshape social
          tasks that currently make limited direct use of AI but rely heavily on AI-generated information.
        presentations:
          - "AIM 2025; WCRS Doctoral Consortium"
